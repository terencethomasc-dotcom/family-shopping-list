<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Shopping List</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1c1e; --muted:#6b7280; --line:#e5e7eb; --accent:#16a34a; --urgent:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111214; --card:#1c1d20; --text:#f2f2f3; --muted:#9ca3af; --line:#2c2e33; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:8px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  input[type=text], select { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); margin-bottom:10px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  button { font-size:16px; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  .toggle { display:flex; gap:8px; margin-bottom:10px; }
  .toggle button { background:var(--bg); color:var(--text); border:1px solid var(--line); flex:1; }
  .toggle button.on-urgent { background:var(--urgent); color:#fff; border-color:var(--urgent); }
  .toggle button.on-normal { background:var(--accent); color:#fff; border-color:var(--accent); }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 0 8px; }
  h2.urgent { color:var(--urgent); }
  .item { display:flex; align-items:center; gap:12px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; }
  .item input { width:22px; height:22px; flex:none; }
  .item .name { flex:1; font-size:17px; }
  .item.done .name { text-decoration:line-through; color:var(--muted); }
  .item small { display:block; color:var(--muted); font-size:12px; }
  .del { background:none; color:var(--muted); padding:6px 10px; font-size:20px; }
  .clear { background:var(--bg); color:var(--muted); border:1px solid var(--line); width:100%; margin-top:10px; }
  .empty { color:var(--muted); text-align:center; padding:30px 0; }
  .who { font-size:14px; color:var(--muted); margin-bottom:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 Family Shopping List</h1>

  <div class="card">
    <div class="who">Your name</div>
    <input type="text" id="who" placeholder="e.g. Mum">
    <input type="text" id="name" placeholder="Add an item…">
    <div class="toggle">
      <button id="btnNormal" class="on-normal" type="button">Not urgent</button>
      <button id="btnUrgent" type="button">🔥 Urgent</button>
    </div>
    <select id="freq">
      <option value="once">One-off</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
    </select>
    <button id="add" type="button" style="width:100%">Add to list</button>
  </div>

  <div id="list"></div>
  <button class="clear" id="clearDone" type="button">Clear ticked items</button>
</div>

<script>
const SUPABASE_URL = "https://umwpcfvxwvosbizfgtlj.supabase.co";
const SUPABASE_KEY = "sb_publishable_2u49IxVwhpd15LBkM_0_iw_9fQsKc5-";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let items = [];
let urgent = false;

const $ = id => document.getElementById(id);
try { $("who").value = localStorage.getItem("who") || ""; } catch (e) {}
$("who").addEventListener("input", () => { try { localStorage.setItem("who", $("who").value); } catch (e) {} });

$("btnNormal").onclick = () => setUrgent(false);
$("btnUrgent").onclick = () => setUrgent(true);
function setUrgent(v) {
  urgent = v;
  $("btnNormal").className = v ? "" : "on-normal";
  $("btnUrgent").className = v ? "on-urgent" : "";
}

async function load() {
  const { data, error } = await db.from("items").select("*").order("created_at", { ascending: true });
  if (error) { $("list").innerHTML = '<div class="empty">Could not load: ' + error.message + '</div>'; return; }
  items = data;
  render();
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function itemHtml(i) {
  const meta = [i.frequency !== "once" ? i.frequency : "", i.added_by ? "by " + i.added_by : ""].filter(Boolean).join(" · ");
  return '<div class="item ' + (i.done ? "done" : "") + '">' +
    '<input type="checkbox" ' + (i.done ? "checked" : "") + ' onchange="toggle(\'' + i.id + '\', this.checked)">' +
    '<div class="name">' + esc(i.name) + (meta ? "<small>" + esc(meta) + "</small>" : "") + '</div>' +
    '<button class="del" onclick="removeItem(\'' + i.id + '\')">×</button></div>';
}

function render() {
  if (!items.length) { $("list").innerHTML = '<div class="empty">Your list is empty 🎉</div>'; return; }
  const groups = [
    ["🔥 Urgent", "urgent", i => i.urgent],
    ["Weekly", "", i => !i.urgent && i.frequency === "weekly"],
    ["Monthly", "", i => !i.urgent && i.frequency === "monthly"],
    ["Other", "", i => !i.urgent && i.frequency === "once"],
  ];
  $("list").innerHTML = groups.map(([title, cls, f]) => {
    const g = items.filter(f);
    return g.length ? '<h2 class="' + cls + '">' + title + '</h2>' + g.map(itemHtml).join("") : "";
  }).join("");
}

$("add").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) return;
  const { error } = await db.from("items").insert({
    name, urgent, frequency: $("freq").value, added_by: $("who").value.trim() || null
  });
  if (error) { alert("Could not add: " + error.message); return; }
  $("name").value = "";
  setUrgent(false);
  load();
};
$("name").addEventListener("keydown", e => { if (e.key === "Enter") $("add").click(); });

window.toggle = async (id, done) => { await db.from("items").update({ done }).eq("id", id); load(); };
window.removeItem = async id => { await db.from("items").delete().eq("id", id); load(); };
$("clearDone").onclick = async () => { await db.from("items").delete().eq("done", true); load(); };

db.channel("items-changes")
  .on("postgres_changes", { event: "*", schema: "public", table: "items" }, load)
  .subscribe();

load();
</script>
</body>
</html>
